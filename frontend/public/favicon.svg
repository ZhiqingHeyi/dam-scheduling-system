<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1929;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a3a5c;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#00d4ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0099cc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#006699;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="damGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4a90a4;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#6bb3c7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4a90a4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00ffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00ccff;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 圆形背景 -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="#00d4ff" stroke-width="1.5"/>
  
  <!-- 水面波纹 -->
  <ellipse cx="32" cy="48" rx="20" ry="4" fill="none" stroke="url(#waterGrad)" stroke-width="1.5" opacity="0.8"/>
  <ellipse cx="32" cy="52" rx="14" ry="3" fill="none" stroke="url(#waterGrad)" stroke-width="1" opacity="0.5"/>
  
  <!-- 拱坝主体 -->
  <path d="M12 45 Q32 20 52 45" fill="none" stroke="url(#damGrad)" stroke-width="4" stroke-linecap="round"/>
  
  <!-- 拱坝内部结构线 -->
  <path d="M18 42 Q32 25 46 42" fill="none" stroke="#7fc8d8" stroke-width="1.5" opacity="0.6"/>
  
  <!-- 水流效果 -->
  <path d="M22 46 Q24 50 22 54" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.9" filter="url(#glow)"/>
  <path d="M32 47 Q32 52 32 56" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.9" filter="url(#glow)"/>
  <path d="M42 46 Q40 50 42 54" fill="none" stroke="url(#accentGrad)" stroke-width="1.5" opacity="0.9" filter="url(#glow)"/>
  
  <!-- 顶部装饰点 -->
  <circle cx="32" cy="22" r="2" fill="#00ffff" filter="url(#glow)"/>
  
  <!-- 两侧装饰 -->
  <circle cx="12" cy="45" r="1.5" fill="#00ccff" opacity="0.8"/>
  <circle cx="52" cy="45" r="1.5" fill="#00ccff" opacity="0.8"/>
</svg>